<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1C1F30"/>
      <stop offset="100%" stop-color="#0F1117"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#A598FA"/>
      <stop offset="100%" stop-color="#6C5FF7"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="64" height="64" rx="15" fill="url(#bg)"/>
  <rect width="64" height="64" rx="15" fill="none" stroke="#7C6AF7" stroke-width="1.2" opacity="0.35"/>

  <!-- Hammer head -->
  <rect x="13" y="13" width="30" height="17" rx="4" fill="url(#accent)"/>

  <!-- Notch cut into bottom-right of head -->
  <rect x="31" y="23" width="12" height="7" rx="1" fill="url(#bg)"/>

  <!-- Handle -->
  <rect x="28" y="29" width="8" height="23" rx="3" fill="url(#accent)" opacity="0.85"/>

  <!-- Code brackets < > on hammer face -->
  <polyline points="18,18 22,21.5 18,25" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.75"/>
  <polyline points="28,18 24,21.5 28,25" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.75"/>

  <!-- Sparks -->
  <circle cx="49" cy="15" r="2.2" fill="#F5A623"/>
  <circle cx="53" cy="22" r="1.4" fill="#F5A623" opacity="0.65"/>
  <circle cx="48" cy="25" r="1" fill="#F5A623" opacity="0.4"/>
</svg>
