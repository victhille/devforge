# Checks run on your PC before a commit (npm install sets them up through « prepare »).
# Skip them once with: git commit --no-verify. The CI runs the full checks anyway.
pre-commit:
  # One after another: Prettier rewrites the files the lint then reads
  piped: true
  commands:
    format:
      glob: "{src,tests,scripts}/**/*.{ts,tsx,mjs,cjs,js}"
      run: npx prettier --write {staged_files}
      stage_fixed: true
    lint:
      glob: "*.{ts,tsx,mjs,cjs,js}"
      run: npx eslint --no-warn-ignored {staged_files}
    personal:
      run: node scripts/check-personal.mjs

commit-msg:
  commands:
    format:
      run: node scripts/check-commit-msg.mjs {1}
