name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  check:
    # The app targets Windows (paths, hosts file, taskkill): test where it runs
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # npm ci takes 2 to 3 minutes on Windows (583 packages, Electron's download):
      # the installed packages are kept as long as package-lock.json does not change
      - uses: actions/cache@v4
        id: deps
        with:
          path: |
            node_modules
            ~\AppData\Local\electron\Cache
          key: deps-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}
      - if: steps.deps.outputs.cache-hit != 'true'
        run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      # End-to-end: the built app, each test on a fresh profile
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-results
          path: test-results/
          retention-days: 7
