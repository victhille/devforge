name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  check:
    # The app targets Windows (paths, hosts file, taskkill): test where it runs
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
