name: Release

on:
  push:
    tags: ['v*']
  # Started by hand on a tag (Actions › Release › Run workflow, "Use workflow from": the tag),
  # when the tag push started nothing: GITHUB_REF_NAME is then the tag, as on a push
  workflow_dispatch:

# Nothing by default: each job asks for what it needs
permissions: {}

jobs:
  # Builds the installer with a read-only token: the code of the dependencies (npm ci, the build)
  # never runs next to a token that can write to the repository
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Tag matches package.json
        run: |
          [ "$GITHUB_REF_TYPE" = tag ] || { echo "Start the release on a tag (vX.Y.Z), not on $GITHUB_REF_NAME"; exit 1; }
          v=$(node -p "require('./package.json').version")
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "Tag $GITHUB_REF_NAME but package.json says $v"; exit 1; }

      # Personal words: the CI skips the release commit, whose changelogs hold new
      # text (the summaries shown in the app and on the site). Nothing is built if one is found.
      # Before npm ci: no dependency's install script has run yet when the secret list is read
      - run: node scripts/check-personal.mjs
        env:
          PERSONAL_PATTERNS: ${{ secrets.PERSONAL_PATTERNS }}

      # Installed from the lock file, not restored from the CI's cache: what ships is built from
      # exactly what package-lock.json names
      - run: npm ci
      # Electron's binary (see the CI, npmmirror copy included): electron-builder takes its zip
      # from the Electron cache, and from the same mirror when GitHub did not answer
      - name: Electron binary
        run: |
          for try in 1 2 3 4; do
            if [ "$try" -gt 2 ]; then
              export ELECTRON_MIRROR=https://npmmirror.com/mirrors/electron/
              echo "GitHub does not answer: trying the npmmirror copy"
            fi
            if node node_modules/electron/install.js; then
              [ -n "${ELECTRON_MIRROR:-}" ] && echo "ELECTRON_MIRROR=$ELECTRON_MIRROR" >> "$GITHUB_ENV"
              exit 0
            fi
            echo "Electron's download failed (try $try of 4)"
            [ "$try" -lt 4 ] && sleep $((try * 15))
          done
          exit 1

      # No `npm run check` here: `npm run release -- prepare` ran it on the release branch, and
      # the CI ran it with the e2e on the release PR (the same code). The installer is built below,
      # with the license and the third-party notices (npm run build writes them).
      - run: npm run build

      - name: Build installer
        run: npx electron-builder --win --x64 --publish never

      - name: Release notes
        run: |
          node scripts/release-notes.mjs "$GITHUB_REF_NAME" > dist/notes.md
          # The installer's checksum, to compare with Get-FileHash after a download
          for f in dist/*.exe; do printf '\n**SHA-256** `%s` : `%s`\n' "$(basename "$f")" "$(sha256sum "$f" | cut -d' ' -f1)" >> dist/notes.md; done

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release
          path: |
            dist/*.exe
            dist/*.exe.blockmap
            dist/latest.yml
            dist/beta.yml
            dist/notes.md
          retention-days: 3
          if-no-files-found: error

  # Publishes what the build made: no checkout, no dependency, only the files and the release
  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      # The build provenance: a signed statement that this installer comes from this workflow and tag
      id-token: write
      attestations: write
      # To start the site rebuild below
      actions: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release
          path: dist

      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          # The installer, and the update file electron-updater reads (with the installer's sha512)
          subject-path: |
            dist/*.exe
            dist/latest.yml

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=""; case "$GITHUB_REF_NAME" in *-*) pre="--prerelease" ;; esac
          # A pre-release (1.0.0-beta.1) also has its channel file, read by the beta channel
          files=(dist/*.exe dist/*.exe.blockmap dist/latest.yml)
          [ -f dist/beta.yml ] && files+=(dist/beta.yml)
          gh release create "$GITHUB_REF_NAME" "${files[@]}" \
            --repo "$GITHUB_REPOSITORY" --verify-tag --title "DevForge ${GITHUB_REF_NAME#v}" --notes-file dist/notes.md $pre

      # A release made with this token starts no workflow of its own (GitHub's rule),
      # except a dispatch: the site rebuilds its « What's new » page and download button
      - name: Rebuild the site
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run site.yml --repo "$GITHUB_REPOSITORY" --ref main
