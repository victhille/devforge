name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The CI's packages (same key, same folders): restored instead of installed again
      - id: lock
        run: echo "key=$(node scripts/deps-key.mjs)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        id: deps
        with:
          path: |
            node_modules
            ~\AppData\Local\electron\Cache
          key: deps-${{ runner.os }}-node22-${{ steps.lock.outputs.key }}
      - if: steps.deps.outputs.cache-hit != 'true'
        run: npm ci

      - name: Tag matches package.json
        run: |
          v=$(node -p "require('./package.json').version")
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "Tag $GITHUB_REF_NAME but package.json says $v"; exit 1; }

      # No `npm run check` here: `npm run release` ran it on this very commit before
      # tagging, and the CI checks it too (with the e2e). The installer is built below.
      - run: npm run build

      - name: Build installer
        run: npx electron-builder --win --x64 --publish never

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/release-notes.mjs "$GITHUB_REF_NAME" > notes.md
          pre=""; case "$GITHUB_REF_NAME" in *-*) pre="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/*.exe dist/*.exe.blockmap dist/latest.yml \
            --title "DevForge ${GITHUB_REF_NAME#v}" --notes-file notes.md $pre
